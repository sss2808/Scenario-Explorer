.inline-filters label{font:10px var(--body);display:flex;gap:3px;align-items:center}
.inline-filters input[type=checkbox]{width:12px;height:12px;accent-color:#258fff}
.workspace{height:calc(100svh - 118px);min-height:470px}
.network-actions{top:50%;bottom:auto;right:0;transform:translateY(-50%)}
.panel-handle{height:62px;width:25px;border:1px solid #4a5a6a;border-radius:6px 0 0 6px;background:#18212a;color:#e1ecf7;font:24px var(--display);cursor:pointer}
.network-actions .text-button{position:absolute;right:30px;top:-31px;white-space:nowrap}
.topic-inner-label{font:650 12px var(--display);fill:#fff;stroke:#060a0e;stroke-width:2px;paint-order:stroke;pointer-events:none}
.network-enter{animation:fade-network .26s ease-out}@keyframes fade-network{from{opacity:.4}to{opacity:1}}
.is-embedded .workspace{height:calc(100svh - 118px)}
@media(max-width:1050px){.workspace{grid-template-columns:minmax(0,1fr) minmax(280px,.72fr);gap:4px;padding:0 5px 8px}.detail-hero{min-height:145px;height:24%}.outer-label{font-size:10px}}
@media(max-width:760px){.workspace,.is-embedded .workspace{display:flex;flex-direction:column;height:auto;overflow:visible}.network-pane{height:520px;min-height:0}.detail-panel{height:440px}.network-actions{top:10px;right:2px;transform:none}.panel-handle{height:34px;width:34px;border-radius:6px}.network-actions .text-button{top:6px;right:45px}}
@media(max-width:480px){.topbar{padding:7px}.scenario-option{padding:6px 8px}.inline-filters select{max-width:130px}.network-pane{height:420px}.detail-panel{height:410px}}
@media(prefers-reduced-motion:reduce){.network-enter{animation:none}}

/* V50 refined controls: one restrained horizontal row, scenario-led. */
.topbar{height:49px;min-height:49px;padding:5px 11px;display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:9px}
.topbar-controls{width:auto;min-width:0;flex:1 1 auto;margin:0;align-self:center;justify-content:flex-start}
.scenario-tabs{display:flex;flex-flow:row nowrap;align-items:center;gap:5px;min-width:0;max-width:100%;overflow-x:auto;scrollbar-width:none}
.scenario-tabs::-webkit-scrollbar{display:none}
.scenario-tabs>.scenario-option{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:max-content;min-width:0;min-height:31px;padding:6px 12px;border-radius:5px;text-align:center;font:600 12px/1.25 var(--display);white-space:nowrap}
.scenario-tabs>.scenario-option[aria-pressed="true"]{background:#173957;color:#fff;border-color:#64a8ed}
.inline-filters{width:auto;min-width:0;min-height:0;display:flex;flex:0 0 auto;align-items:center;gap:5px;position:relative}
.filter-menu{position:relative;flex:0 0 auto}
.inline-filters .compact-filter{width:max-content;min-width:0;padding:6px 9px;display:inline-flex;gap:7px;justify-content:center;align-items:center;white-space:nowrap;border:1px solid #343c46;border-radius:5px;background:#0f151d;color:#c6d1df;font:500 11px/1.4 var(--display);min-height:31px}
.inline-filters .compact-filter:hover,.inline-filters .compact-filter[aria-expanded=true]{border-color:#708496;background:#1c2733}
.inline-filters .compact-filter.is-filtered{border-color:#68a3d5;color:#fff}
.compact-popover{position:absolute;z-index:90;top:calc(100% + 7px);right:0;width:205px;padding:13px;background:#1b222b;border:1px solid #465465;border-radius:6px;box-shadow:0 13px 32px #000a}
.compact-popover fieldset{display:block;border:0;padding:0;margin:0}
.compact-popover legend{font:600 11px/1.3 var(--display);color:#f0f4f8;margin-bottom:9px}
.compact-popover .filter-checks{display:grid;grid-template-columns:1fr;gap:9px}
.compact-popover .filter-checks label{font:400 11px/1.4 var(--body);color:#e1e9f4;display:flex;gap:8px;align-items:center}
.compact-popover .filter-checks input{width:14px;height:14px;accent-color:#258fff}
.compact-popover label[for]{display:block;margin:0 0 5px;color:#aabbd0;font:500 11px var(--display)}
.compact-popover select{display:block;width:100%;margin:0 0 12px;height:32px;font:11px var(--body);background:#101820;border:1px solid #425367;border-radius:5px;padding:5px 6px}
.inline-filters #reset-filters{width:auto;border:0;padding:5px 0;background:transparent;font:500 11px var(--display);color:#9fcaff}
.workspace,.is-embedded .workspace{height:calc(100svh - 49px)}
@media(max-width:760px){.topbar{height:46px;min-height:46px;padding:4px 7px;gap:6px}.topbar-controls{margin:0;align-self:center}.scenario-tabs>.scenario-option{font-size:11px;min-height:30px;padding:5px 8px}.inline-filters .compact-filter{font-size:10px;padding:5px 7px;min-height:30px}.workspace,.is-embedded .workspace{height:auto}}
@media(max-width:450px){.topbar{gap:4px}.scenario-tabs{gap:3px}.scenario-tabs>.scenario-option{font-size:10.5px;padding:5px 6px}.inline-filters{gap:3px}.inline-filters .compact-filter{font-size:10px;padding:5px}.compact-popover{right:0;width:min(205px,calc(100vw - 20px))}}

/* V72 fullscreen belongs to the network toolbar, after STEEP and Refine. */
.inline-filters .explorer-fullscreen-button{display:inline-flex;flex:0 0 31px;align-items:center;justify-content:center;width:31px;height:31px;min-width:31px;padding:0;border:1px solid #343c46;border-radius:5px;background:#0f151d;color:#c6d1df;cursor:pointer}
.inline-filters .explorer-fullscreen-button:hover,.inline-filters .explorer-fullscreen-button[aria-pressed="true"]{background:#1c2733;border-color:#708496;color:#f6f9fe}
.inline-filters .explorer-fullscreen-button:focus-visible{outline:2px solid #69adff;outline-offset:2px}
.explorer-fullscreen-button svg{width:17px;height:17px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.explorer-fullscreen-button .shrink-arrows{display:none}
.explorer-fullscreen-button[aria-pressed="true"] .expand-arrows{display:none}
.explorer-fullscreen-button[aria-pressed="true"] .shrink-arrows{display:block}
@media(max-width:760px){.inline-filters .explorer-fullscreen-button{flex-basis:30px;min-width:30px;width:30px;height:30px}}
</style>
</head>
<body>
  <a class="skip-link" href="#explorer">Skip to explorer</a>
<div class="topbar" role="toolbar" aria-label="Scenario Explorer controls">
<div class="topbar-controls"><div id="scenario-options" class="scenario-tabs" role="group" aria-label="Compare future scenarios"></div></div>
<div class="inline-filters" id="filters-popover" aria-label="Refine the network">
  <div class="filter-menu">
    <button id="steep-toggle" class="compact-filter" type="button" aria-expanded="false" aria-controls="steep-dropdown">STEEP <span aria-hidden="true">⌄</span></button>
    <div id="steep-dropdown" class="compact-popover" hidden>
      <fieldset><legend>STEEP dimensions</legend><div class="filter-checks" id="steep-filters"></div></fieldset>
    </div>
  </div>
  <div class="filter-menu">
    <button id="refine-toggle" class="compact-filter" type="button" aria-expanded="false" aria-controls="refine-dropdown">Refine <span aria-hidden="true">⌄</span></button>
    <div id="refine-dropdown" class="compact-popover" hidden>
      <label for="horizon-select">Horizon</label>
      <select id="horizon-select"><option value="all">All horizons</option><option value="2026–2030">2026–2030</option><option value="2031–2036">2031–2036</option></select>
      <label for="classification-select">Signal type</label>
      <select id="classification-select"><option value="all">All types</option><option>Emerging signal</option><option>Structural driver</option><option>Decision practice</option></select>
      <button id="reset-filters" type="button">Reset filters</button>
    </div>
  </div>
  <span id="filter-count" class="sr-only"></span><span id="filter-dot" hidden></span>
  <button id="explorer-fullscreen" class="explorer-fullscreen-button" type="button" aria-label="Enter full screen" aria-pressed="false" title="Full screen">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <g class="expand-arrows"><path d="M14 10 21 3m-6 0h6v6M10 14 3 21m0-6v6h6"/></g>
      <g class="shrink-arrows"><path d="M21 3 14 10m0-6v6h6M3 21l7-7m7 6v-6H4"/></g>
    </svg>
  </button>
</div></div>
  <main id="explorer" class="workspace" aria-label="Scenario explorer">
    <section class="network-pane" aria-label="Interactive system domain and signal network">
      
      <div class="svg-stage"><svg id="radial-network" viewBox="0 0 1000 800" role="group" aria-label="Eight system domains surrounded by forty signals. Select a domain or signal to explore their connections.">
        <title>Manufacturing equipment procurement futures network</title><desc>Eight inner system domains and forty outer signals. Selecting nodes highlights domain and signal connections.</desc>
      </svg></div>
      <span class="sr-only" id="shown-count">40</span><span class="sr-only" id="total-count">40</span>
      <div class="network-actions"><button id="clear-selection" class="text-button" hidden type="button">← Back</button><button id="panel-toggle" class="panel-handle" type="button" aria-controls="detail-panel" aria-label="Hide details panel" aria-expanded="true" title="Hide details panel">›</button></div>
      <div class="hover-card" id="node-tooltip" role="status" hidden></div>
    </section>

  themes: [
    {id:'trust',name:'Trust and governance',angle:-90,lead:'Trust and governance are critical to resilient, competitive equipment procurement.',subtitle:'Building confidence in a more complex procurement future',paragraphs:[
      'As manufacturing becomes more digital, global and interdependent, trust and governance become central to equipment procurement. Buyers need confidence in the integrity, security and compliance of suppliers, technologies and shared data across complex, multi-tier ecosystems.',
      'Looking ahead, greater transparency, data sharing and responsible adoption of AI and digital twins may shape how organizations establish confidence. Clear governance, verified supplier claims and interoperable evidence can reduce uncertainty and strengthen supplier relationships.'
    ],risk:'Fragmented responsibilities can hide security, quality and qualification risks.',response:'Make qualification evidence, ownership and data handling visible early in the buying journey.',question:'Who is accountable for validating critical supplier and technology claims?'},
    {id:'technical',name:'Technical validation',angle:-45,lead:'Technical evidence influences which equipment reaches the shortlist.',subtitle:'Qualification requirements meet faster buying cycles',paragraphs:[
      'Specifications, performance data, interoperability documentation and qualification evidence often shape equipment decisions before an RFP is issued. Teams need to compare technical fit and long-term compatibility, not only price.',
      'As facilities standardize digital engineering tools, reusable technical assets could help buyers evaluate equipment more consistently while increasing the cost of being absent from early design conversations.'
    ],risk:'Missing evidence can exclude otherwise viable suppliers before procurement begins.',response:'Make engineering models, technical specifications and qualification pathways easy to evaluate.',question:'What evidence must be available at concept design versus final selection?'},
    {id:'supplier',name:'Supplier ecosystems',angle:0,lead:'Equipment decisions increasingly depend on connected supplier networks.',subtitle:'Value extends beyond individual vendors',paragraphs:[
      'Platform providers, engineering firms, original equipment manufacturers and specialist integrators may each influence a project. Selection criteria become distributed across relationships rather than concentrated in one purchasing department.',
      'Supplier ecosystems can expand capabilities, but also introduce dependency, interoperability and accountability questions. The ability to participate in a partner-led solution becomes a strategic capability.'
    ],risk:'Vendor lock-in and opaque partner roles can reduce options and bargaining power.',response:'Build interoperable offerings and clarify partner responsibilities across the lifecycle.',question:'Who actually shapes the shortlist before the buying team issues a request?'},
    {id:'workflow',name:'Workflow orchestration',angle:45,lead:'Connected workflows could reshape the speed and ownership of equipment purchasing.',subtitle:'From fragmented handoffs to coordinated decisions',paragraphs:[
      'Manufacturing procurement spans engineering, quality, finance, operations and external delivery partners. Today, many steps still depend on repeated document requests, manual data transfer and fragmented approvals.',
      'Digital specifications, workflow automation and shared technical data may reduce cycle times. Their value depends on clearly defined decision rights and support for exceptions rather than automation alone.'
    ],risk:'Disconnected systems create rework, lost context and unclear responsibility.',response:'Design cross-functional workflows around evidence, handoffs and accountable decisions.',question:'Where do decision delays originate, and which handoffs can be simplified?'},
    {id:'risk',name:'Risk and resilience',angle:90,lead:'Resilience depends on understanding dependencies before disruptions occur.',subtitle:'Planning under uncertainty',paragraphs:[
      'Capital projects face supplier capacity constraints, geopolitical shifts, environmental requirements and demand uncertainty. A low-cost selection may carry higher consequences when delivery, validation or service is disrupted.',
      'Organizations may increasingly assess alternate sourcing, qualification readiness, service coverage and continuity together. Scenario planning helps test decisions across multiple plausible futures rather than relying on one forecast.'
    ],risk:'Single points of failure can emerge from specifications, suppliers and regional exposure.',response:'Stress-test sourcing options and monitor leading signals before commitment.',question:'Which dependencies would be hardest to replace during a project delay?'},
    {id:'ai',name:'AI-assisted evaluation',angle:135,lead:'AI could change how buyers interpret evidence and compare equipment.',subtitle:'Decision support, not decision substitution',paragraphs:[
      'AI-assisted RFP drafting, specification matching and information extraction could help teams navigate long, technical buying processes. These tools may change how a supplier is discovered, compared and shortlisted.',
      'Outputs still depend on data quality, accountable human review and clear evaluation criteria. Designing for traceability matters as much as accelerating the first draft.'
    ],risk:'Automated recommendations can amplify incomplete or biased technical evidence.',response:'Build traceable, human-reviewed evaluation workflows with explicit confidence and provenance.',question:'How will buyers audit why equipment was recommended or excluded?'},
    {id:'procurement',name:'Procurement operations',angle:180,lead:'Commercial decisions are shaped by constraints well beyond the quoted price.',subtitle:'Balancing value, speed and lifecycle cost',paragraphs:[
      'Procurement teams reconcile cost, timing, supplier qualification, technical fit and changing project needs. Approval structures and data fragmentation can slow decisions after technical preferences are already established.',
      'Improved cost transparency, contracting workflows and earlier stakeholder coordination could help buyers compare total value and avoid late-stage surprises.'
    ],risk:'Late commercial engagement can make procurement reactive rather than strategic.',response:'Bring commercial, technical and operational criteria into the decision earlier.',question:'Where do price, capability and lifecycle outcomes come into tension?'},
    {id:'service',name:'Service and lifecycle support',angle:225,lead:'The purchase is only the beginning of equipment value.',subtitle:'Service evidence shapes long-term confidence',paragraphs:[
      'Installation, validation, uptime, maintenance and eventual replacement all affect equipment economics. Service models can influence supplier selection even when those benefits are difficult to compare during procurement.',
      'Remote diagnostics, predictive maintenance and clearer performance data may create stronger lifecycle partnerships, while also raising questions about ownership of operational data and long-term support.'
    ],risk:'Weak service continuity can turn an apparently favorable purchase into operational disruption.',response:'Surface lifecycle support commitments and measurable service performance during evaluation.',question:'How can buyers compare service outcomes before equipment is installed?'}

        +`<p class="detail-disclaimer">${(s.id==='ideal'||s.kind==='preferred')?'A preferred future for backcasting, not a prediction.':'A plausible structural scenario, not a prediction.'} Evidence links are illustrative.</p>`;
      const credit=document.createElement('p');credit.className='scenario-photo-credit';
      const link=document.createElement('a');link.href=s.imagePage;link.target='_blank';link.rel='noopener noreferrer';link.textContent='Photo: '+s.imageCredit;
      credit.appendChild(link);el.content.appendChild(credit);
      el.panelContext.textContent='';
      el.viewLabel.textContent=scenarioNavText();
    } else {
      el.title.textContent=window.ScenarioWorkbookModel?.active?source.project:'Manufacturing equipment futures';el.subtitle.textContent='An interconnected system of decisions and emerging change';el.eyebrow.textContent='Research network';
      el.content.innerHTML=`<h3>${window.ScenarioWorkbookModel?.active?'Explore changes in this fictional system.':'Explore how the buying system could change.'}</h3><p>Choose a scenario to examine its possible implications. Select a domain or signal to explore the network.</p>`
        +`<button class="back-link" data-action="scenario">Explore the structural scenarios →</button><p class="detail-disclaimer">Illustrative data only. No confidential records or verified source attributions are embedded.</p>`;
      el.panelContext.textContent='Choose a system domain, signal or future state.';
      el.viewLabel.textContent='Overview';
    }
    if(window.ScenarioWorkbookModel?.active){
      const disclosure=document.createElement('p');disclosure.className='detail-disclaimer';
      disclosure.textContent='SYNTHETIC EXAMPLE · Epistemic status: hypothetical/conditional · Rights: fictional demonstration only; not research-cleared.';
      el.content.appendChild(disclosure);
    }
    if(resetScroll)el.panelBody.scrollTop=0;
    el.content.querySelectorAll('[data-action]').forEach(button=>button.addEventListener('click',()=>{
      if(button.dataset.action==='scenario')select('scenario',null,0);
      else restorePrevious();
    }));
    $('prev-scenario').disabled=false;$('next-scenario').disabled=false;
    el.status.textContent=`Showing ${el.title.textContent}`;
  }
  function select(mode,id=null,index=null){
    if(mode==='overview'||mode==='theme'||mode==='scenario') {
      state.rootSignal=null;state.innerFocus=null;
      if(mode==='overview'||mode==='scenario')state.trail=[];
    }
    if(mode!=='scenario' || state.mode!=='scenario') { if(state.mode!=='signal')state.previous={mode:state.mode,selected:state.selected,scenarioIndex:state.scenarioIndex}; }
    state.mode=mode;if(id!==null)state.selected=id;if(index!==null)state.scenarioIndex=index;
    if(mode==='scenario'&&el.menuLabel)el.menuLabel.innerHTML=`${htmlEscape(scenarios[state.scenarioIndex].name)}<br><span style="font-size:12px;color:#b7c3d1">${scenarios[state.scenarioIndex].label}</span>`;
    else if(el.menuLabel)el.menuLabel.innerHTML=window.ScenarioWorkbookModel?.active?htmlEscape(source.project):'Futures of manufacturing<br>equipment procurement';
    closeMenu();hideTooltip();drawGraph();renderPanel();updateMenuSelection();
  }
  function restorePrevious(){
    if(state.trail.length){const p=state.trail.pop();state.rootSignal=p.root;state.innerFocus=p.inner;state.mode=p.mode;state.selected=p.selected;drawGraph();renderPanel();return;}
    state.rootSignal=null;state.innerFocus=null;select('overview');
  }
    function moveScenario(delta){
    const index=state.mode==='scenario'?(state.scenarioIndex+delta+scenarios.length)%scenarios.length:(delta>0?0:scenarios.length-1);
    select('scenario',null,index);
  }
  function closeMenu(){}
  function closeFilters(){
    for(const [button,pop] of [[el.steepToggle,el.steepDropdown],[el.refineToggle,el.refineDropdown]]) {pop.hidden=true;button.setAttribute('aria-expanded','false');}
  }
  function updateMenuSelection(){
    el.options.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(state.mode==='scenario'&&Number(b.dataset.index)===state.scenarioIndex)));
  }
  function buildMenu(){
    el.options.innerHTML=scenarios.map((s,i)=>'<button class="scenario-option" data-index="'+i+'" type="button" aria-pressed="false">'+htmlEscape(s.name)+'</button>').join('');
    el.options.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>select('scenario',null,Number(b.dataset.index))));
  }
  function buildFilters(){
    for(const [button,pop] of [[el.steepToggle,el.steepDropdown],[el.refineToggle,el.refineDropdown]]){
      button.addEventListener('click',()=>{
        const opening=pop.hidden;closeFilters();pop.hidden=!opening;button.setAttribute('aria-expanded',String(opening));
      });
    }
    document.addEventListener('click',event=>{if(!event.target.closest('.filter-menu'))closeFilters();});
    if(source.checkpoints){
      el.year.innerHTML='<option value="all">All horizons</option>'+source.checkpoints.map(w=>'<option value="'+htmlEscape(w.label)+'">'+htmlEscape(w.label)+'</option>').join('');
      el.classification.innerHTML='<option value="all">All types</option>'+source.classifications.map(c=>'<option value="'+htmlEscape(c)+'">'+htmlEscape(c)+'</option>').join('');
    }
    el.steep.innerHTML=dims.map(dim=>`<label><input type="checkbox" data-steep="${dim}" checked> ${dim}</label>`).join('');
    el.steep.querySelectorAll('input').forEach(input=>input.addEventListener('change',()=>{
      if(input.checked)state.steep.add(input.dataset.steep);else state.steep.delete(input.dataset.steep);
      refreshFilters();
    }));
    el.year.addEventListener('change',()=>{state.horizon=el.year.value;refreshFilters();});
    el.classification.addEventListener('change',()=>{state.classification=el.classification.value;refreshFilters();});
    $('reset-filters').addEventListener('click',()=>{
      state.steep=new Set(dims);state.search='';state.horizon='all';state.classification='all';
      el.year.value='all';el.classification.value='all';
      el.steep.querySelectorAll('input').forEach(i=>i.checked=true);refreshFilters();
    });
  }
  function refreshFilters(){
    drawGraph();
    if(state.mode==='theme'||state.rootSignal)renderPanel(false);
    const count=signals.filter(visible).length;
    el.steepToggle.classList.toggle('is-filtered',state.steep.size!==dims.length);
    el.refineToggle.classList.toggle('is-filtered',state.horizon!=='all'||state.classification!=='all');
    el.status.textContent=`${count} signals visible`;
  }

  $('prev-scenario').addEventListener('click',()=>moveScenario(-1));
  $('next-scenario').addEventListener('click',()=>moveScenario(1));

  el.resetFocus.addEventListener('click',()=>state.trail.length?restorePrevious():select('overview'));
  el.panelToggle.addEventListener('click',togglePanel);
    document.addEventListener('keydown',event=>{if(event.key==='Escape'){closeMenu();closeFilters();hideTooltip();}});
  buildMenu();buildFilters();drawGraph();renderPanel();updateMenuSelection();
  window.__scenarioExplorer={
    getState:()=>({mode:state.mode,selected:state.selected,topicRoot:state.rootSignal,topicInner:state.innerFocus,trailLength:state.trail.length,scenario:scenarios[state.scenarioIndex].name,
      count:signals.filter(visible).length,total:signals.length,themeCount:themes.length,scenarioCount:scenarios.length,scenarioIds:scenarios.map(s=>s.id),signalIds:signals.map(s=>s.id),domainIds:themes.map(t=>t.id),edgeCount:edgesForGraph(activeIds()).length,bookVersion:window.ScenarioWorkbookModel?.active?window.ScenarioWorkbookModel.version:null,panelOpen:state.panelOpen,renderer:state.presentation}),
    selectTheme:id=>{if(themeById.has(id))select('theme',id);},
    selectSignal:id=>{if(signals.some(s=>s.id===id))openTopic(id);},
    back:restorePrevious,
    selectTopicInner:id=>selectInner(id),
    setEmbedMode,
    selectScenario:i=>{if(i>=0&&i<scenarios.length)select('scenario',null,i);},
    reset:()=>select('overview'),
    getMotionState:()=>({...motionMetrics}),
    activateD3:()=>{if(window.d3){state.presentation='D3 v7';drawGraph(true);}}
  };
})();

</script>
  <script src="assets/d3.v7.min.js"></script>
<script>if (!window.d3) { try { window.d3 = window.parent.d3; } catch (_) {} } window.__scenarioExplorer?.activateD3?.();</script>
  <script src="assets/workbook-import.js"></script>
  <script>
  // The icon operates the portfolio's existing fullscreen container in-place.
  // Standalone explorer.html can fullscreen its own document as a fallback.
  (() => {
    const button=document.getElementById('explorer-fullscreen');
    if(!button)return;
    let host=null,owner=document;
    try{
      const frame=window.frameElement;
      const parentDocument=window.parent.document;
      const portfolioHost=parentDocument.getElementById('se65-explorer');
      if(frame?.id==='se48-live'&&portfolioHost?.contains(frame)){
        owner=parentDocument;
        host=portfolioHost;
      }
    }catch(_){ /* Cross-origin hosting uses document fullscreen instead. */ }
    const target=host||document.documentElement;
    const sync=()=>{
      const active=owner.fullscreenElement===target;
      button.setAttribute('aria-pressed',String(active));
      button.setAttribute('aria-label',active?'Exit full screen':'Enter full screen');
      button.title=active?'Exit full screen':'Full screen';
    };
    button.addEventListener('click',()=>{
      try{
        // Request directly from the user gesture, without a message/event delay.
        const result=owner.fullscreenElement===target?owner.exitFullscreen():target.requestFullscreen();
        Promise.resolve(result).then(sync,()=>{sync();button.title='Full screen unavailable';});
      }catch(_){sync();button.title='Full screen unavailable';}
    });
    owner.addEventListener('fullscreenchange',sync);
    sync();
  })();
  </script>
